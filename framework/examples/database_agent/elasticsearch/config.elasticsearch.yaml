# Elasticsearch 数据源示例配置
# 使用方式：go run . -config config.elasticsearch.yaml
# 需设置环境变量 OPENAI_API_KEY；可选 OPENAI_BASE_URL
model: "openai/gpt-3.5-turbo"
max_history: 10
middlewares: ["logging", "metrics","debug"]

data_sources:
  - id: "main"
    type: "elasticsearch"
    # 完整 URL，或使用 host + port（默认 9200）
    dsn: "http://10.137.211.84:29200"
    # 可选：Basic 认证
    # user: "elastic"
    # password: "changeme"

default_datasource_id: "main"
data_allow_write: false
