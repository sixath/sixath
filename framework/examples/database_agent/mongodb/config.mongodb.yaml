# MongoDB 数据源示例配置（database_agent）
# 运行前设置 OPENAI_API_KEY；可选 OPENAI_BASE_URL
#
# 在 framework 目录下：
#   go run ./examples/database_agent/mongodb -config ./examples/database_agent/mongodb/config.mongodb.yaml
#
# MongoDB 要求配置 dbname（数据库名）；可用 dsn，或用 host/port/user/password 组装。
model: "openai/gpt-3.5-turbo"
max_history: 10
middlewares: ["logging", "metrics"]

data_sources:
  - id: "main"
    type: "mongodb"
    host: "127.0.0.1"
    port: 27017
    user: "admin"
    password: "secret"
    dbname: "appdb"
    # 认证库对应 mongo --authenticationDatabase；缺省即为 admin
    # auth_source: "admin"
    # 若使用完整连接串，可注释 host/port/user/password/dbname，仅保留：
    # 密码含 @ 时请写成 %40，并带上 authSource=admin
    # dsn: "mongodb://admin:p%40ss@127.0.0.1:27017/appdb?authSource=admin"
    max_open_conns: 10
    read_only: true

default_datasource_id: "main"
data_allow_write: false
