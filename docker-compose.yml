services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      # host 3306 often taken; expose on 13306
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    ports:
      # host 8000 taken by moya-aiops; use 18000/19000
      - "18000:8000"
      - "19000:9000"
    volumes:
      - ./portal/configs/config.docker.yaml:/data/conf/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      # host 8080 taken by http-server; use 18080
      - "18080:80"
    depends_on:
      - portal

volumes:
  mysql_data:
