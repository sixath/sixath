<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话界面 - 科技靛蓝指令块</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    keyframes: {
                        wave: {
                            '0%, 100%': { transform: 'scaleY(1)' },
                            '50%': { transform: 'scaleY(2)' },
                        }
                    },
                    animation: {
                        'wave': 'wave 1s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 font-sans h-screen flex overflow-hidden antialiased">

<!-- 左侧简易导航 (模拟) -->
<aside class="w-64 border-r border-slate-200 bg-white flex flex-col z-20 hidden md:flex">
    <div class="h-16 flex items-center px-6 border-b border-slate-100">
        <div class="w-5 h-5 rounded bg-gradient-to-tr from-indigo-500 to-cyan-400 mr-3 shadow-sm flex items-center justify-center">
            <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
        </div>
        <span class="text-sm font-bold tracking-widest text-slate-800">SIXATH</span>
    </div>
    <nav class="flex-1 px-3 space-y-1 mt-4">
        <a href="#" class="flex items-center px-3 py-2.5 text-sm font-semibold text-indigo-600 bg-indigo-50 rounded-xl transition-colors">
            对话
        </a>
        <a href="#" class="flex items-center px-3 py-2.5 text-sm font-medium text-slate-500 rounded-xl hover:bg-slate-50 transition-colors">
            工具管理
        </a>
    </nav>
</aside>

<!-- 右侧主内容区 -->
<main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    <!-- 顶栏 -->
    <header class="h-16 border-b border-slate-200 flex items-center px-8 bg-white/80 backdrop-blur-md z-10">
        <h1 class="text-sm font-medium text-slate-400">对话</h1>
    </header>

    <!-- 聊天记录区 -->
    <div class="flex-1 overflow-auto p-8 relative">
        <div class="max-w-3xl mx-auto space-y-8">

            <!-- AI 之前回复的信息 (演示上下文) -->
            <div class="flex justify-start">
                <div class="flex max-w-[85%] w-full">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center mr-4 flex-shrink-0 mt-1 shadow-sm text-white text-xs font-bold">AI</div>
                    <div class="flex-1 space-y-3">
                        <div class="text-sm text-slate-700 bg-white px-5 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-slate-100 inline-block">
                            好的，我已接收到您的排查指令。正在调取底层数据...
                        </div>
                    </div>
                </div>
            </div>

            <!-- ⭐ 核心：用户提问 (科技靛蓝指令块) -->
            <div class="flex justify-end">
                <div class="bg-white border border-indigo-200 rounded-xl rounded-tr-sm max-w-xl shadow-[0_4px_15px_-3px_rgba(79,70,229,0.1)] hover:shadow-[0_8px_25px_-5px_rgba(79,70,229,0.15)] hover:border-indigo-300 transition-all duration-300 overflow-hidden group">

                    <!-- 头部标签栏 -->
                    <div class="flex items-center px-4 py-2 bg-indigo-50/50 border-b border-indigo-100">
                        <span class="text-[10px] font-bold text-indigo-700 bg-indigo-100 border border-indigo-200/50 px-2 py-0.5 rounded font-mono shadow-sm">#user_input</span>
                        <span class="ml-2 text-[10px] font-mono text-indigo-500/70">role: user</span>
                    </div>

                    <!-- 内容区 -->
                    <div class="p-5 flex items-start space-x-3 relative">
                        <!-- 渐变头像块 -->
                        <div class="flex-shrink-0 mt-0.5 flex items-center justify-center w-6 h-6 rounded-md bg-gradient-to-br from-indigo-500 to-blue-500 text-white font-mono text-[10px] shadow-sm">U</div>

                        <!-- 提示词文字 -->
                        <div class="flex-1">
                            <p class="text-sm leading-relaxed text-slate-800 font-mono text-xs">现在这个vmid 上有哪些进程</p>
                        </div>

                        <!-- 灵动波形动画 -->
                        <div class="flex items-end space-x-0.5 h-3 mt-1.5 opacity-60 group-hover:opacity-100 transition-opacity">
                            <div class="w-0.5 h-2 bg-indigo-400 rounded-full animate-wave" style="animation-delay: 0ms"></div>
                            <div class="w-0.5 h-3 bg-indigo-400 rounded-full animate-wave" style="animation-delay: 150ms"></div>
                            <div class="w-0.5 h-1.5 bg-indigo-400 rounded-full animate-wave" style="animation-delay: 300ms"></div>
                            <div class="w-0.5 h-3 bg-indigo-400 rounded-full animate-wave" style="animation-delay: 450ms"></div>
                        </div>
                    </div>

                    <!-- 底部时间栏 -->
                    <div class="px-5 py-2 border-t border-indigo-50 flex justify-end bg-indigo-50/20">
                        <span class="text-[10px] font-mono text-indigo-400/80 group-hover:text-indigo-500 transition-colors">11:35:31</span>
                    </div>

                </div>
            </div>

            <!-- AI 后续回复 (演示下文) -->
            <div class="flex justify-start">
                <div class="flex max-w-[85%] w-full">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center mr-4 flex-shrink-0 mt-1 shadow-sm text-white text-xs font-bold">AI</div>
                    <div class="flex-1 space-y-3">
                        <div class="text-sm text-slate-700 bg-white px-5 py-3 rounded-2xl rounded-tl-sm shadow-sm border border-slate-100 inline-block">
                            好的，正在为您执行命令...
                        </div>

                        <!-- AI 执行日志卡片 -->
                        <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden text-sm">
                            <div class="px-4 py-2 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                                <span class="text-xs font-semibold text-slate-600">执行日志</span>
                                <span class="text-[10px] text-teal-600 bg-teal-50 px-2 py-0.5 rounded font-mono">执行成功</span>
                            </div>
                            <div class="p-4 font-mono text-xs text-slate-600 space-y-2">
                                <div class="flex items-center space-x-2"><span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span><span>模型推理 deepseek-v4-pro</span></div>
                                <div class="flex items-center space-x-2"><span class="w-1.5 h-1.5 rounded-full bg-teal-400"></span><span>实例命令 vm_run_cmd</span></div>
                                <div class="flex items-center space-x-2"><span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span><span>模型推理 deepseek-v4-pro</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 底部输入框 (简化版) -->
    <div class="p-6 bg-gradient-to-t from-[#F8FAFC] via-[#F8FAFC] to-transparent">
        <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-2 pl-4 flex items-center">
            <input type="text" placeholder="输入指令或问题..." class="flex-1 bg-transparent text-sm focus:outline-none text-slate-800 placeholder-slate-400">
            <button class="w-8 h-8 rounded-xl bg-indigo-600 hover:bg-indigo-700 flex items-center justify-center text-white transition-colors">
                <svg class="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </div>
    </div>
</main>
</body>
</html>
