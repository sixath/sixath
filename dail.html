<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话区域优化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(149, 157, 165, 0.1)',
                        'float': '0 10px 30px -5px rgba(0, 0, 0, 0.08)',
                        'send-glow': '0 0 15px rgba(79, 70, 229, 0.4)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 font-sans h-screen flex flex-col justify-between">

<!-- 顶部区域 (模拟) -->
<header class="h-16 border-b border-slate-200 flex items-center justify-between px-8 bg-white/80 backdrop-blur-md z-10">
    <h2 class="text-base font-semibold text-slate-800">Chat</h2>

    <!-- ✨ 优化后的顶部 Agent 选择器：无边框胶囊态 -->
    <div class="flex items-center space-x-3">
        <div class="flex items-center bg-indigo-50 border border-indigo-100 rounded-full px-3 py-1.5 shadow-sm hover:bg-indigo-100 transition-colors cursor-pointer group">
            <span class="text-xs font-medium text-slate-500 mr-2">Agent</span>
            <div class="flex items-center">
                <!-- 状态小圆点 -->
                <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 mr-2 breathing-dot"></span>
                <span class="text-xs font-semibold text-indigo-700">自建agent (deepseek-v4-pro)</span>
                <svg class="w-3 h-3 text-indigo-500 ml-2 group-hover:translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </div>
        <button class="text-xs font-medium text-slate-500 hover:text-slate-800 bg-white border border-slate-200 px-3 py-1.5 rounded-full shadow-sm transition-all">Show Debug</button>
    </div>
</header>

<!-- 中间聊天记录区域 (模拟，省略具体内容) -->
<main class="flex-1 overflow-auto p-8 relative">
    <div class="max-w-3xl mx-auto space-y-6 opacity-30">
        <!-- 模拟的聊天记录线框 -->
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-4 bg-slate-200 rounded w-1/2"></div>
        <div class="h-4 bg-slate-200 rounded w-3/4"></div>
        <div class="h-4 bg-slate-200 rounded w-2/3"></div>
    </div>
</main>

<!-- ✨ 优化后的底部输入区域 -->
<div class="p-6 bg-gradient-to-t from-[#F8FAFC] via-[#F8FAFC] to-transparent z-20">
    <div class="max-w-3xl mx-auto flex items-end space-x-3">

        <!-- 彻底移除独立的下拉框，或者将其化为极简的内嵌标签 -->
        <div class="flex-1 bg-white rounded-2xl shadow-float border border-slate-200 hover:border-indigo-300 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all duration-300 flex flex-col overflow-hidden">

            <!-- 输入框内嵌顶部工具栏 (包含 Agent 切换) -->
            <div class="px-4 py-2 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center space-x-2 cursor-pointer group">
                    <div class="w-5 h-5 rounded-full bg-indigo-100 flex items-center justify-center">
                        <span class="text-[10px] text-indigo-600 font-bold">AI</span>
                    </div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-indigo-600 transition-colors">默认 (openai/deepseek-v4-pro)</span>
                    <svg class="w-3 h-3 text-slate-400 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
                <span class="text-[10px] text-slate-400 font-mono">Shift + Enter 换行</span>
            </div>

            <!-- 输入区 -->
            <div class="flex items-end p-2 pl-4">
                <textarea rows="1" placeholder="给 AI Agent 发送指令..." class="flex-1 bg-transparent border-none text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-0 resize-none py-3 max-h-32"></textarea>

                <!-- 优雅的圆形发送按钮 -->
                <button class="w-10 h-10 rounded-xl bg-indigo-600 hover:bg-indigo-700 flex items-center justify-center text-white shadow-send-glow hover:scale-105 active:scale-95 transition-all duration-200 ml-2 flex-shrink-0">
                    <svg class="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    /* 简单的呼吸灯动效 */
    @keyframes breathe {
        0%, 100% { opacity: 0.6; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.1); }
    }
    .breathing-dot { animation: breathe 2s ease-in-out infinite; }
</style>
</body>
</html>
