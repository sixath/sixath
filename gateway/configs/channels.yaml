# Gateway ChannelRegistry (compose mounts this file).
# E2E: see _neo4j_q/verify_inbound_gateway.ps1
channels:
  - id: demo-webhook
    type: webhook
    default_agent: "1583f45b-d5c3-41ab-b1f7-1aa5539126d4"
    webhook_secret: "dev-webhook-secret"
    ip_whitelist: []
    enabled: true
    default_reply_mode: async
  # Used by E2E to assert disabled channel → HTTP 410
  - id: demo-webhook-disabled
    type: webhook
    default_agent: "1583f45b-d5c3-41ab-b1f7-1aa5539126d4"
    webhook_secret: "dev-webhook-secret"
    ip_whitelist: []
    enabled: false
    default_reply_mode: async
  # WeCom smart-bot long connection — DO NOT commit real bot_id/secret
  # Console: 智能机器人 AI+ → API →「使用长连接」
  # Same bot_id must not be enabled on multiple Gateway instances.
  - id: sixath4
    type: wecom_bot
    default_agent: "e8107fb3-e40a-4207-9d9a-6768847aaf79"
    enabled: true
    bot_id: "aibY6-AgsLf2heYuUTeRkNZFhfd38KM3X7a"
    secret: "vsVCIvMGoyRThFRZ71N75PrRT9XrVBKkCLFJRevG8HN"
    bot_names: ["sixath"]
    ws_url: "wss://openws.work.weixin.qq.com"
    # Optional: resolve 发起人 to WeCom display name (contacts API). Do NOT commit secrets.
    # corp_id: "<企业 CorpID>"
    # corp_secret: "<自建应用 Secret，需通讯录/成员读取>"
