# Gateway ChannelRegistry (compose mounts this file).
# E2E: see _neo4j_q/verify_inbound_gateway.ps1
#
# This committed file is a SAFE DEFAULT — it must never contain credentials.
# For real WeCom smart-bot credentials pick one of:
#   1. cp configs/channels.example.yaml configs/channels.local.yaml   # gitignored
#      then: SATH_CHANNELS_FILE=channels.local.yaml docker compose up -d
#   2. set WECOM_BOT_ID / WECOM_BOT_SECRET and flip `enabled: true` below.
channels:
  - id: demo-webhook
    type: webhook
    default_agent: "1583f45b-d5c3-41ab-b1f7-1aa5539126d4"
    webhook_secret: "dev-webhook-secret"
    ip_whitelist: []
    enabled: true
    default_reply_mode: async
  # Used by E2E to assert disabled channel → HTTP 410
  - id: demo-webhook-disabled
    type: webhook
    default_agent: "1583f45b-d5c3-41ab-b1f7-1aa5539126d4"
    webhook_secret: "dev-webhook-secret"
    ip_whitelist: []
    enabled: false
    default_reply_mode: async
  # WeCom smart-bot long connection — requires real credentials, therefore
  # disabled in the repository default. See configs/channels.example.yaml.
  # Console: 智能机器人 AI+ → API →「使用长连接」
  # Same bot_id must not be enabled on multiple Gateway instances.
  - id: sixath4
    type: wecom_bot
    default_agent: "e8107fb3-e40a-4207-9d9a-6768847aaf79"
    enabled: false
    bot_id: ""
    secret: ""
    bot_names: ["sixath"]
    ws_url: "wss://openws.work.weixin.qq.com"
    # Optional: resolve 发起人 to WeCom display name (contacts API).
    # corp_id: "${WECOM_CORP_ID}"
    # corp_secret: "${WECOM_CORP_SECRET}"
