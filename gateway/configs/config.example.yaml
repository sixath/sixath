listen: ":8088"
# Local: 127.0.0.1:8000. Docker Compose: use config.docker.yaml (http://portal:8000).
portal_base_url: "http://127.0.0.1:8000"
# Overridable via env SATH_RUNTIME_TOKEN (compose default: dev-runtime-token)
runtime_token: "dev-runtime-token"
turn_timeout_sec: 600
# turn_timeout_sec covers wecom/webhook single turns; Web SSE has no Client total timeout (see runtimeclient).
# DEPRECATED — ignored at runtime. Channel config is owned by Portal; Gateway syncs via GET /runtime/v1/gateway/channels.
# channels.yaml is archive/import only (see portal/cmd/import-gateway-channels).
# channels_file: "./configs/channels.yaml"
# Web 用户鉴权：调用 Portal GET /api/v1/auth/me（不透明 Bearer），无 jwt_secret
