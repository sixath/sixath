secrets:
  neo4j_password:
    file: ./secrets/neo4j_password.txt

services:
  neo4j:
    profiles: ["neo4j"]
    image: neo4j:5
    secrets:
      - neo4j_password
    entrypoint: ["/bin/bash", "/neo4j-entrypoint.sh"]
    volumes:
      - ./deploy/neo4j/docker-entrypoint.sh:/neo4j-entrypoint.sh:ro
      - neo4j_data:/data
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    mem_limit: 1536m

  portal:
    secrets:
      - neo4j_password
    volumes:
      - ./deploy/portal/agent_extra.neo4j.yaml:/data/conf-ro/agent_extra.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy
        required: false

volumes:
  neo4j_data:
