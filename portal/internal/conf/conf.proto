syntax = "proto3";
package kratos.api;

option go_package = "backend/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Skills skills = 3;
  // 成长复盘 worker（spec 二期里程碑 2.1+）
  Growth growth = 4;
  Auth auth = 5;
}

// Auth configures local ACL bootstrap identities.
message Auth {
  string bootstrap_user_id = 1;
  string bootstrap_token = 2;
  string bootstrap_org_id = 3;
  string service_principal_user_id = 4;
  string bootstrap_email = 5;
  string bootstrap_password = 6;
  string smtp_host = 7;
  int32 smtp_port = 8;
  string smtp_user = 9;
  string smtp_password = 10;
  string smtp_from = 11;
  // public_base_url is the web origin for absolute verify-email links (e.g. https://app.example.com).
  string public_base_url = 12;
}

// Growth 只保留 /route 分类器用的 llm（auxiliary 优先）。
message Growth {
  reserved 1 to 4, 6 to 23;
  GrowthLLM llm = 5;
}

// GrowthLLM 是 /route 分类器的模型配置（与 model.NewModelFromConfig 对齐）。
message GrowthLLM {
  string provider = 1;   // openai / dashscope / ollama
  string model = 2;
  string api_key = 3;
  string base_url = 4;
  // max_transcript_runes 限制 prompt 中 transcript 截断长度；<=0 不截断。
  int32 max_transcript_runes = 5;
  reserved 6, 7, 9;
  // auxiliary 可选：分类器优先用更便宜的独立模型。
  GrowthLLM auxiliary = 8;
}

message Skills {
  bool allow_script_execution = 1;  // 是否允许 execute_skill_script，默认 true
  reserved 2 to 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
  string data_root = 3;
  // code_roots are absolute container paths allowed for browse / workspace-link (e.g. /mnt/codes).
  repeated string code_roots = 4;
}
