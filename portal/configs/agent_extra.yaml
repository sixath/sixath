# 可选：与 Bootstrap（config.yaml）同目录；启动时由 main 自动加载。
# 见 framework/config.PortalAgentExtra 与 design-memory-tools §6.3。
# P2-G：优先使用 memory_store: 嵌套块；与顶层 memory_* 并存时以 memory_store 为准。

tool_guardrails:
  enabled: false
  warnings_only: true
  same_args_failure_warn: 2
  same_args_failure_halt: 0
  same_tool_failure_warn: 3
  same_tool_failure_halt: 0
  # idempotent_tools: []   # 省略则用框架默认名单
  # mutating_tools: []

# 推荐（P2-G）：统一 memory_store 外壳
