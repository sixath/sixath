# 联网搜索（Bocha / Tavily）；与 config.yaml 中 growth.llm.web 或顶层 web 节同形。
# web:
#   search_backend: bocha
#   bocha_api_key: "your-bocha-key"
#   tools_enabled: true

# Memory Hub（P0）：进程启动注册 local Governance/Knowledge；改 defaults 需重启。
# Agent 覆盖正式字段见 RuntimeToolsConfig（P1）；此处仅文档占位。
# Prefetch 行为不因 Hub Catalog 改变（Loadout 默认不含 bulk units）。
# memory_hub:
#   enabled: true
#   defaults:
#     governance: local
#     knowledge: local
#   # loadout_include_visible_units: false
#   # knowledge_search 默认源：transcript + workspace + graph（若可用）；不含 units
#   # P2a：外部 Adapter 骨架（fake）；真实 Tencent 客户端未交付。
#   # adapters:
#   #   - fake   # 或设环境变量 SATH_HUB_FAKE_ADAPTER=true
#   # skills:
#   #   require_manual_approve_unsigned_hub_skill: true
#   #   rematerialize_on_version_change: true
#   # cache:  # 或 SATH_HUB_SKILLS_CACHE
#   #   root: data/hub-skills

portal:
  guardrail_halt:
    # 展示：none（仅错误码）| banner（默认一句说明）| brief | full（与 trace 注入全文一致）
    display: banner
    persist_system_message: false
