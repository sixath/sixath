server:
  http:
    addr: 0.0.0.0:8000
    # 流式对话需较长时间；经 nginx 反代时一并拉长 proxy_read_timeout
    timeout: 600s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 30s
skills:
  allow_script_execution: true
  auto_route_enabled: false  # P3 已拆 SKILL 全文预注入；此键现网无调用者
  route_min_score: 5
  route_max_body_runes: 12000
growth:
  # /route 分类器读 llm；未配则 fail-open。也可用 SATH_GROWTH_LLM_*。
  # llm:
  #   provider: openai
  #   model: gpt-4o-mini
  #   api_key: "your-key"
  #   base_url: "https://api.openai.com/v1"
runtime:
  # Gateway → Portal Runtime service token（可用 SATH_RUNTIME_TOKEN 覆盖）。
  service_token: "dev-runtime-token"
chat:
  # 对外 Chat 入站默认关闭；生产路径 Gateway → /runtime/v1。
  public_inbound_enabled: false
auth:
  bootstrap_user_id: "bootstrap"
  bootstrap_org_id: "default"
  # email/password/token 由 SATH_BOOTSTRAP_* / secrets 注入
data:
  # Persist agent workspaces + skills across container recreate (compose mounts this path).
  data_root: /data/portal
  code_roots:
    - /mnt/codes
  database:
    driver: mysql
    source: root:root@tcp(mysql:3306)/sath?parseTime=True&loc=Local&charset=utf8mb4
