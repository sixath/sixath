server:
  http:
    addr: 0.0.0.0:8000
    # JSON API 超时（Kratos 默认 1s）。流式 /runtime/v1/turns 忽略该 deadline，
    # 由 ReAct MaxSteps 与客户端断开收束。
    timeout: 120s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 30s
skills:
  allow_script_execution: true
growth:
  # /route 分类器读 llm；未配则 fail-open。也可用 SATH_GROWTH_LLM_*。
  # llm:
  #   provider: openai
  #   model: gpt-4o-mini
  #   api_key: "your-key"
  #   base_url: "https://api.openai.com/v1"
  #   max_transcript_runes: 24000
# 环境变量：SATH_GROWTH_LLM_MODEL、SATH_GROWTH_LLM_PROVIDER、SATH_GROWTH_LLM_API_KEY、SATH_GROWTH_LLM_BASE_URL
data:
  data_root: "./data"
  database:
    driver: mysql
    # 需先创建数据库，或执行 scripts/init_mysql.sql
    source: root:root@tcp(localhost:3306)/sath?parseTime=True&loc=Local&charset=utf8mb4
runtime:
  # Gateway → Portal Runtime service token（可用 SATH_RUNTIME_TOKEN 覆盖）。
  service_token: "dev-runtime-token"
chat:
  # 对外 Chat 入站（create session / send message / SSE）默认关闭；走 Gateway → /runtime/v1。
  # 本地直连调试可设 true，或用 SATH_CHAT_PUBLIC_INBOUND_ENABLED=true。
  public_inbound_enabled: false
# 仓库 handbook 的 LLM 增强层（P2b）。model 为空则只生成静态 handbook；
# 名字按模型目录解析：模型名，或 "<provider 名称或 ID>/<模型名>"。仓库页可单独覆盖（off 为禁用）。
# 环境变量 SATH_HANDBOOK_MODEL 覆盖 model。下列数值为默认值，0 或不填也取默认。
handbook:
  model: ""
  concurrency: 4            # 每轮并发模型调用，上限 16
  max_cards_per_run: 600    # 每轮最多新生成的文件卡片
  max_file_kb: 24           # 每个文件发给模型的内容上限，上限 256
  max_run_minutes: 15       # 每轮时间预算，上限 20
  skeleton_rebuild_days: 30 # 骨架定期重建间隔
auth:
  # 仅用于本地默认 ACL 锚点；生产环境请替换 token。
  bootstrap_user_id: "bootstrap"
  bootstrap_org_id: "default"
  bootstrap_token: "dev-bootstrap-token"
  service_principal_user_id: "bootstrap"
  # Optional: set email/password on the bootstrap user for login (idempotent on restart).
  # bootstrap_email: "admin@example.com"
  # bootstrap_password: "change-me"
  # Optional SMTP — when smtp_host is set, registration sends verify-email links.
  # smtp_host: "smtp.example.com"
  # smtp_port: 587
  # smtp_user: ""
  # smtp_password: ""
  # smtp_from: "noreply@example.com"
  # Optional public origin for absolute verify-email links in outbound mail.
  # When unset, links are relative (/verify-email?token=...) for same-origin frontends.
  # public_base_url: "https://app.example.com"
  # 企微 CorpApp Web 登录
  # wecom_corp_id: "wwxxxxxxxx"      # 企业 CorpID（SSO 的 appid）
  # wecom_agent_id: "1000096"        # 自建应用 AgentID
  # wecom_secret: "****"             # 该应用 Secret（gettoken）
  # wecom_redirect_uri: "https://portal.example.com/api/v1/auth/wecom/callback"
