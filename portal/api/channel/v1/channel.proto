syntax = "proto3";

package channel.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "common/common.proto";

option go_package = "backend/api/channel/v1;v1";

// 渠道管理服务
service Channel {
  // 创建渠道
  rpc CreateChannel (CreateChannelRequest) returns (ChannelReply) {
    option (google.api.http) = {
      post: "/api/v1/channels"
      body: "*"
    };
  }
  // 渠道列表（分页、筛选）
  rpc ListChannels (ListChannelsRequest) returns (ListChannelsReply) {
    option (google.api.http) = {
      get: "/api/v1/channels"
    };
  }
  // 获取单个渠道
  rpc GetChannel (GetChannelRequest) returns (ChannelReply) {
    option (google.api.http) = {
      get: "/api/v1/channels/{id}"
    };
  }
  // 更新渠道
  rpc UpdateChannel (UpdateChannelRequest) returns (ChannelReply) {
    option (google.api.http) = {
      put: "/api/v1/channels/{id}"
      body: "*"
    };
  }
  // 删除渠道
  rpc DeleteChannel (DeleteChannelRequest) returns (DeleteChannelReply) {
    option (google.api.http) = {
      delete: "/api/v1/channels/{id}"
    };
  }
  // 向 WxPusher 渠道发送消息
  rpc SendChannel (SendChannelRequest) returns (SendChannelReply) {
    option (google.api.http) = {
      post: "/api/v1/channels/{id}/send"
      body: "*"
    };
  }
  // Webhook 入站
  rpc WebhookInbound (WebhookInboundRequest) returns (WebhookInboundReply) {
    option (google.api.http) = {
      post: "/api/v1/webhooks/{channel_id}"
      body: "*"
    };
  }
}

message CreateChannelRequest {
  string channel_id = 1;
  string type = 2;  // web | api | webhook | wxpusher | wecom | wecom_bot
  string default_agent = 3;
  bool enabled = 4;
  string webhook_path = 5;
  string webhook_secret = 6;
  repeated string ip_whitelist = 7;
  string app_token = 8;
  repeated string default_uids = 9;
  string webhook_url = 10;
  repeated string allowed_agents = 11;
  // wecom_bot / webhook gateway fields (write on create)
  string bot_id = 12;
  string secret = 13;            // maps to bot_secret; never returned in replies
  repeated string bot_names = 14;
  string ws_url = 15;
  string corp_id = 16;
  string corp_secret = 17;       // write-only; never returned in replies
  string default_reply_mode = 18; // async|sync (webhook)
  optional bool auto_route_enabled = 19;
  optional bool auto_route_mention = 20;
  optional bool auto_route_classifier = 21;
}

message ListChannelsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string type = 3;
  optional bool enabled = 4;
}

message ListChannelsReply {
  api.common.BaseResponse ret = 1;
  repeated ChannelReply items = 2;
  int32 total = 3;
}

message GetChannelRequest {
  string id = 1;
}

// UpdateChannelRequest.updates supports the same keys as CreateChannelRequest fields
// (snake_case), including gateway keys: bot_id, secret (alias for bot_secret),
// bot_secret, bot_names, ws_url, corp_id, corp_secret, default_reply_mode.
// Empty secret/bot_secret/corp_secret values are ignored (preserve existing).
message UpdateChannelRequest {
  string id = 1;
  google.protobuf.Struct updates = 2;
}

message DeleteChannelRequest {
  string id = 1;
}

message DeleteChannelReply {
  api.common.BaseResponse ret = 1;
}

message SendChannelRequest {
  string id = 1;
  string content = 2;
  string summary = 3;
  repeated string uids = 4;
}

message SendChannelReply {
  api.common.BaseResponse ret = 1;
}

message WebhookInboundRequest {
  string channel_id = 1;
  string content = 2;
  string agent_id = 3;
  string reply_url = 4;
}

message WebhookInboundReply {
  api.common.BaseResponse ret = 1;
  bool async = 2;
  string content = 3;
}

// RuntimeStatus is the Admin-facing derived gateway status (wecom_bot only).
message RuntimeStatus {
  string state = 1;                 // connected|disconnected|reconnecting|disabled|unknown
  string last_heartbeat_at = 2;     // RFC3339; empty if unset
  string last_error = 3;
  int32 reconnect_attempt = 4;
  int32 reconnect_in_ms = 5;
}

message ChannelReply {
  api.common.BaseResponse ret = 1;
  string id = 2;
  string channel_id = 3;
  string type = 4;
  string default_agent = 5;
  bool enabled = 6;
  string webhook_path = 7;
  repeated string ip_whitelist = 8;
  repeated string default_uids = 9;
  string created_at = 10;
  string updated_at = 11;
  string webhook_url_masked = 12;  // wecom only; masked display, never full URL
  repeated string allowed_agents = 13;
  // wecom_bot / webhook gateway (secrets never returned as plaintext)
  string bot_id = 14;
  bool secret_set = 15;            // true if bot_secret is non-empty
  repeated string bot_names = 16;
  string ws_url = 17;
  string corp_id = 18;
  string default_reply_mode = 19;
  RuntimeStatus runtime_status = 20; // wecom_bot only; omitted/nil otherwise
  bool auto_route_enabled = 21;
  bool auto_route_mention = 22;
  bool auto_route_classifier = 23;
}
